<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut Precision Copyright-Free Guide</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-sliders text-amber-500 text-2xl"></i>
                <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-emerald-400 bg-clip-text text-transparent">
                    CapCut Precision Settings Studio
                </h1>
            </div>
            <span class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">v4.0.0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 mt-4">

        <!-- Left Column: Input Form -->
        <section class="lg:col-span-5 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl h-fit">
            <h2 class="text-lg font-semibold mb-4 text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> ပလက်ဖောင်းနှင့် အချက်အလက် ရွေးချယ်ပါ
            </h2>

            <form id="workflowForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Video Source / Name</label>
                    <input type="text" id="videoSource" placeholder="ဥပမာ - TikTok Video / Movie Clip" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Target Platform (ပလက်ဖောင်း)</label>
                    <select id="platform" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="tiktok">TikTok / Reels / Shorts (9:16)</option>
                        <option value="youtube">YouTube Long Video (16:9)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Editing Style</label>
                    <select id="style" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="Video Recap">Video Recap</option>
                        <option value="Reaction">Reaction</option>
                        <option value="Top 5 List">Top 5 List</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Key Points (အဓိက အချက်များ)</label>
                    <textarea id="keyPoints" rows="3" placeholder="နိဒါန်း၊ အဓိကဇာတ်ကြောင်း၊ နိဂုံးချုပ်..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required></textarea>
                </div>

                <button type="submit" 
                    class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> ချိန်ညှိရန် Settings များ ထုတ်ယူမည်
                </button>
            </form>
        </section>

        <!-- Right Column: Generated Output -->
        <section class="lg:col-span-7 space-y-6">
            
            <!-- Output Container -->
            <div id="outputContainer" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl hidden">
                <div class="flex flex-wrap justify-between items-center mb-4 pb-3 border-b border-slate-700 gap-2">
                    <h2 class="text-lg font-semibold text-emerald-400 flex items-center gap-2">
                        <i class="fa-solid fa-sliders"></i> CapCut Precision Editing Settings
                    </h2>
                    <div class="flex items-center gap-2">
                        <button onclick="copyToClipboard()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                            <i class="fa-solid fa-copy"></i> Copy
                        </button>
                        <button onclick="downloadTextFile()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition font-medium">
                            <i class="fa-solid fa-download"></i> Download .txt
                        </button>
                    </div>
                </div>

                <div id="workflowOutput" class="space-y-4 text-sm text-slate-300">
                    <!-- Dynamic Content Generated Here -->
                </div>
            </div>

            <!-- Placeholder State -->
            <div id="placeholderState" class="bg-slate-800/50 border border-dashed border-slate-700 p-12 rounded-xl text-center">
                <i class="fa-solid fa-sliders text-4xl text-slate-600 mb-3 block"></i>
                <p class="text-slate-400">ဘယ်ဘက်တွင် ပလက်ဖောင်းနှင့် အချက်အလက်များ ရွေးချယ်၍ CapCut တိကျသော Settings များကို ထုတ်ယူပါ။</p>
            </div>

        </section>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        document.getElementById('workflowForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const source = document.getElementById('videoSource').value;
            const platformVal = document.getElementById('platform').value;
            const style = document.getElementById('style').value;
            const rawPoints = document.getElementById('keyPoints').value;
            
            const pointsArray = rawPoints.split('\n').filter(p => p.trim() !== '');

            let platformName = platformVal === 'tiktok' ? 'TikTok / Shorts / Reels (9:16)' : 'YouTube Long Video (16:9)';

            // Specific adjustment values based on platform choice
            let settingsHTML = '';
            if (platformVal === 'tiktok') {
                settingsHTML = `
                    <ul class="list-disc list-inside space-y-1.5 text-slate-300">
                        <li><strong>Aspect Ratio:</strong> 9:16 (Vertical)</li>
                        <li><strong>Brightness (အလင်းရောင်):</strong> <span class="text-amber-400 font-bold">+5</span> (Adjust > Adjustments > Brightness)</li>
                        <li><strong>Contrast (အမှောင်အလင်းကွာခြားချက်):</strong> <span class="text-amber-400 font-bold">+4</span></li>
                        <li><strong>Saturation (အရောင်စိုစွတ်မှု):</strong> <span class="text-amber-400 font-bold">+6</span></li>
                        <li><strong>Speed (အမြန်နှုန်း):</strong> <span class="text-amber-400 font-bold">1.08x</span> (TikTok AI ရှောင်ရန် အကောင်းဆုံး)</li>
                        <li><strong>Zoom / Scale:</strong> <span class="text-amber-400 font-bold">6%</span> (မျက်နှာပြင်ကို အနည်းငယ်ချဲ့ပါ)</li>
                        <li><strong>Mirror (ပြန်လှည့်ခြင်း):</strong> <span class="text-amber-400 font-bold">ON (ဘယ်/ညာ လှည့်ပါ)</span></li>
                    </ul>
                `;
            } else {
                settingsHTML = `
                    <ul class="list-disc list-inside space-y-1.5 text-slate-300">
                        <li><strong>Aspect Ratio:</strong> 16:9 (Horizontal)</li>
                        <li><strong>Brightness (အလင်းရောင်):</strong> <span class="text-amber-400 font-bold">+3</span> (Adjust > Adjustments > Brightness)</li>
                        <li><strong>Contrast (အမှောင်အလင်းကွာခြားချက်):</strong> <span class="text-amber-400 font-bold">+3</span></li>
                        <li><strong>Saturation (အရောင်စိုစွတ်မှု):</strong> <span class="text-amber-400 font-bold">+5</span></li>
                        <li><strong>Speed (အမြန်နှုန်း):</strong> <span class="text-amber-400 font-bold">1.03x</span> (YouTube Content ID ရှောင်ရန်)</li>
                        <li><strong>Zoom / Scale:</strong> <span class="text-amber-400 font-bold">4%</span></li>
                        <li><strong>Mirror (ပြန်လှည့်ခြင်း):</strong> <span class="text-amber-400 font-bold">Optional (မဖြစ်မနေ မလိုပါ)</span></li>
                    </ul>
                `;
            }

            const outputHTML = `
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-amber-400 mb-2">🎯 ရွေးချယ်ထားသော ပလက်ဖောင်း: ${platformName}</h3>
                    <p><strong>ဗီဒီယိုအရင်းအမြစ်:</strong> ${source} (${style})</p>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-emerald-400 mb-2">⚙️ CapCut Adjust & Copyright-Free Settings (အတိအကျ တန်ဖိုးများ)</h3>
                    ${settingsHTML}
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-red-400 mb-2">🔇 အသံပိုင်းဆိုင်ရာ တည်းဖြတ်ရန် (Audio Settings)</h3>
                    <ul class="list-disc list-inside space-y-1 text-slate-300">
                        <li>မူရင်း ဗီဒီယိုအသံ Volume = <span class="text-red-400 font-bold">0 (Mute)</span></li>
                        <li>ကိုယ်ပိုင် Voiceover အသံ Volume = <span class="text-emerald-400 font-bold">100%</span></li>
                        <li>နောက်ခံသီချင်း (BGM) Volume = <span class="text-amber-400 font-bold">12%</span> သာ ထားပါ။</li>
                    </ul>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-blue-400 mb-2">✂️ ဖြတ်တောက်ခြင်းနှင့် အပိုင်းခွဲခြင်း (Split & Cuts)</h3>
                    <ul class="list-disc list-inside space-y-1 text-slate-300">
                        <li>ဗီဒီယိုဖိုင်ကို <span class="text-amber-400 font-bold">3 စက္ကန့်မှ 4 စက္ကန့်</span> တစ်ကြိမ်စီ Split လုပ်ပါ။</li>
                        <li>အစ/အဆုံးရှိ Watermark များကို ခြေရာလက်ရာမကျန်အောင် ဖြတ်ထုတ်ပါ။</li>
                    </ul>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-teal-400 mb-2">📌 အဓိက အချက်များ (Key Points)</h3>
                    <ul class="list-disc list-inside space-y-1 text-slate-200">
                        ${pointsArray.map(p => `<li>${p}</li>`).join('')}
                    </ul>
                </div>
            `;

            document.getElementById('workflowOutput').innerHTML = outputHTML;
            document.getElementById('placeholderState').classList.add('hidden');
            document.getElementById('outputContainer').classList.remove('hidden');
        });

        function copyToClipboard() {
            const container = document.getElementById('workflowOutput');
            navigator.clipboard.writeText(container.innerText).then(() => {
                alert('Copied to Clipboard!');
            });
        }

        function downloadTextFile() {
            const container = document.getElementById('workflowOutput');
            const fileName = 'CapCut_Precision_Settings.txt';

            const blob = new Blob([container.innerText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
