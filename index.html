<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut Master Workflow Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-scissors text-red-500 text-2xl"></i>
                <h1 class="text-xl font-bold bg-gradient-to-r from-red-400 to-amber-400 bg-clip-text text-transparent">
                    CapCut Master Workflow Studio
                </h1>
            </div>
            <span class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">v2.0.0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 mt-4">

        <!-- Left Column: Input Form -->
        <section class="lg:col-span-5 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl h-fit">
            <h2 class="text-lg font-semibold mb-4 text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-film"></i> ဗီဒီယို တည်းဖြတ်ရန် ဖြည့်စွက်ပါ
            </h2>

            <form id="workflowForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Video Link / File Name</label>
                    <input type="text" id="videoSource" placeholder="ဥပမာ - TikTok Link သို့မဟုတ် ဖိုင်နာမည်" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Video Topic / Title</label>
                    <input type="text" id="videoTopic" placeholder="ဥပမာ - အံ့ဖွယ် သဘာဝဖြစ်ရပ်များ" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Target Platform</label>
                        <select id="platform" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            <option value="TikTok / Shorts (9:16)">TikTok / Shorts (9:16)</option>
                            <option value="YouTube Long (16:9)">YouTube Long (16:9)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Style</label>
                        <select id="style" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            <option value="Video Recap">Video Recap</option>
                            <option value="Reaction">Reaction</option>
                            <option value="Top 5 List">Top 5 List</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Key Points (အဓိက အချက်များ - တစ်ကြောင်းစီ)</label>
                    <textarea id="keyPoints" rows="3" placeholder="နိဒါန်း၊ အဓိကအချက်များ၊ နိဂုံးချုပ်..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" required></textarea>
                </div>

                <button type="submit" 
                    class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Step-by-Step Plan ထုတ်ယူမည်
                </button>
            </form>
        </section>

        <!-- Right Column: Generated Workflow Output -->
        <section class="lg:col-span-7 space-y-6">
            
            <!-- Output Container -->
            <div id="outputContainer" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl hidden">
                <div class="flex flex-wrap justify-between items-center mb-4 pb-3 border-b border-slate-700 gap-2">
                    <h2 class="text-lg font-semibold text-emerald-400 flex items-center gap-2">
                        <i class="fa-solid fa-list-check"></i> CapCut Professional Editing Steps
                    </h2>
                    <div class="flex items-center gap-2">
                        <button onclick="copyToClipboard()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                            <i class="fa-solid fa-copy"></i> Copy
                        </button>
                        <button onclick="downloadTextFile()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition font-medium">
                            <i class="fa-solid fa-download"></i> Download .txt
                        </button>
                    </div>
                </div>

                <div id="workflowOutput" class="space-y-4 text-sm text-slate-300">
                    <!-- Dynamic Content Generated Here -->
                </div>
            </div>

            <!-- Placeholder State -->
            <div id="placeholderState" class="bg-slate-800/50 border border-dashed border-slate-700 p-12 rounded-xl text-center">
                <i class="fa-solid fa-scissors text-4xl text-slate-600 mb-3 block"></i>
                <p class="text-slate-400">ဘယ်ဘက်တွင် အချက်အလက်များ ဖြည့်စွက်၍ CapCut Triage Workflow အပြည့်အစုံကို ထုတ်ယူပါ။</p>
            </div>

        </section>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        document.getElementById('workflowForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const source = document.getElementById('videoSource').value;
            const topic = document.getElementById('videoTopic').value;
            const platform = document.getElementById('platform').value;
            const style = document.getElementById('style').value;
            const rawPoints = document.getElementById('keyPoints').value;
            
            const pointsArray = rawPoints.split('\n').filter(p => p.trim() !== '');

            // Timestamps generation
            let timestampsHTML = `00:00 - Intro / အစပိုင်း<br>`;
            let currentTimeSec = 15;
            pointsArray.forEach((point) => {
                let mins = Math.floor(currentTimeSec / 60);
                let secs = currentTimeSec % 60;
                let timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                timestampsHTML += `${timeStr} - ${point.trim()}<br>`;
                currentTimeSec += 45;
            });

            const prompt1 = `Cinematic high-CTR thumbnail for ${topic}, dramatic lighting, hyper-realistic --ar 16:9 --v 6.0`;
            const prompt2 = `Intense cinematic moment, mysterious atmosphere --ar 9:16 --v 6.0`;

            const outputHTML = `
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-amber-400 mb-2">📌 Step 1: Project Setup & Source</h3>
                    <p><strong>Source:</strong> ${source}</p>
                    <p><strong>Platform:</strong> ${platform} (${style})</p>
                    <p class="text-xs text-slate-400 mt-1">CapCut တွင် New Project ဖွင့်ပြီး မလိုအပ်သော အစ/အဆုံး Watermark များကို ဖြတ်ထုတ်ပါ။</p>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-red-400 mb-2">🔇 Step 2: Audio Removal (Copyright Protection)</h3>
                    <ul class="list-disc list-inside space-y-1 text-slate-300">
                        <li>မူရင်းဗီဒီယို Volume ကို <strong>0 (Mute)</strong> သို့ လျှော့ပါ။</li>
                        <li>CapCut Audio > Record ကိုသုံး၍ ကိုယ်ပိုင် Voiceover သွင်းပါ။</li>
                        <li>နောက်ခံသီချင်း (BGM) ထည့်ပါက Volume ကို <strong>10% မှ 15%</strong> သသာ ထားပါ။</li>
                    </ul>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-blue-400 mb-2">✂️ Step 3: Split, Re-arrange & Speed</h3>
                    <ul class="list-disc list-inside space-y-1 text-slate-300">
                        <li>ဗီဒီယိုဖိုင်ကို <strong>3 စက္ကန့်မှ 5 စက္ကန့်</strong> တစ်ကြိမ် Split လုပ်ပါ။</li>
                        <li>အမြန်နှုန်း (Speed) ကို <strong>1.05x သို့မဟုတ် 1.1x</strong> သို့ တိုးပါ။</li>
                    </ul>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-purple-400 mb-2">🎨 Step 4: Visual Alterations (Anti-Algorithm)</h3>
                    <ul class="list-disc list-inside space-y-1 text-slate-300">
                        <li><strong>Zoom/Crop:</strong> ဗီဒီယိုကို 5% ခန့် Zoom ဆွဲပါ။</li>
                        <li><strong>Mirror:</strong> Edit > Mirror ဖြင့် ဘယ်/ညာ ပြောင်းပြန်လှည့်ပါ။</li>
                        <li><strong>Adjustments:</strong> Contrast +3, Saturation +5 သို့ ပြောင်းပါ။</li>
                    </ul>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-emerald-400 mb-2">🎙️ Step 5: Voiceover & Script Draft</h3>
                    <p class="mb-1 text-xs text-slate-400">[Opening Hook - 0 to 3s]:</p>
                    <p class="bg-slate-950 p-2 rounded text-slate-200 mb-2">"မင်းတို့ရော ${topic} အကြောင်း တကယ်သိကြရဲ့လား? ဒီဗီဒီယိုမှာ ကြည့်စရာတွေအပြည့်ပဲ!"</p>
                    <p class="mb-1 text-xs text-slate-400">[Body]:</p>
                    <p class="bg-slate-950 p-2 rounded text-slate-200">${pointsArray.join('<br>')}</p>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-teal-400 mb-2">⏱️ Step 6: YouTube Timestamps</h3>
                    <div class="bg-slate-950 p-3 rounded border border-slate-800 text-xs font-mono text-emerald-300 select-all space-y-1">
                        ${timestampsHTML}
                    </div>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-cyan-400 mb-2">🚀 Step 7: Export Settings</h3>
                    <p><strong>Resolution:</strong> 1080p (သို့မဟုတ် 4K) | <strong>Frame Rate:</strong> 60fps | <strong>Code Rate:</strong> Recommended</p>
                </div>
            `;

            document.getElementById('workflowOutput').innerHTML = outputHTML;
            document.getElementById('placeholderState').classList.add('hidden');
            document.getElementById('outputContainer').classList.remove('hidden');
        });

        function copyToClipboard() {
            const container = document.getElementById('workflowOutput');
            navigator.clipboard.writeText(container.innerText).then(() => {
                alert('Copied to Clipboard!');
            });
        }

        function downloadTextFile() {
            const container = document.getElementById('workflowOutput');
            const topicInput = document.getElementById('videoTopic').value || 'CapCut_Workflow';
            const fileName = topicInput.replace(/[^a-zA-Z0-9သူမြန်မာ]/g, '_') + '_workflow.txt';

            const blob = new Blob([container.innerText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
