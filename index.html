<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut Pro Anti-Copyright Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-amber-500 text-2xl"></i>
                <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-emerald-400 bg-clip-text text-transparent">
                    CapCut Pro Anti-Copyright Studio
                </h1>
            </div>
            <span class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">v7.0.0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-6 mt-4">

        <!-- Left Column: Input Form -->
        <section class="md:col-span-5 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl h-fit">
            <h2 class="text-lg font-semibold mb-4 text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> ပလက်ဖောင်း ရွေးချယ်ပါ
            </h2>

            <form id="workflowForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Target Platform (ပလက်ဖောင်း)</label>
                    <select id="platform" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="tiktok">TikTok / Shorts / Reels (9:16)</option>
                        <option value="youtube">YouTube Long Video (16:9)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Editing Style</label>
                    <select id="style" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="Video Recap">Video Recap</option>
                        <option value="Reaction">Reaction</option>
                        <option value="Top 5 List">Top 5 List</option>
                    </select>
                </div>

                <button type="submit" 
                    class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Pro Anti-Copyright Settings ထုတ်ယူမည်
                </button>
            </form>
        </section>

        <!-- Right Column: Generated Output -->
        <section class="md:col-span-7 space-y-6">
            
            <!-- Output Container -->
            <div id="outputContainer" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl hidden">
                <div class="flex flex-wrap justify-between items-center mb-4 pb-3 border-b border-slate-700 gap-2">
                    <h2 class="text-lg font-semibold text-emerald-400 flex items-center gap-2">
                        <i class="fa-solid fa-sliders"></i> CapCut Pro Anti-Copyright Settings
                    </h2>
                    <div class="flex items-center gap-2">
                        <button onclick="copyToClipboard()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                            <i class="fa-solid fa-copy"></i> Copy
                        </button>
                        <button onclick="downloadTextFile()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 transition font-medium">
                            <i class="fa-solid fa-download"></i> Download .txt
                        </button>
                    </div>
                </div>

                <div id="workflowOutput" class="space-y-4 text-sm text-slate-300">
                    <!-- Dynamic Content Generated Here -->
                </div>
            </div>

            <!-- Placeholder State -->
            <div id="placeholderState" class="bg-slate-800/50 border border-dashed border-slate-700 p-12 rounded-xl text-center">
                <i class="fa-solid fa-shield-halved text-4xl text-slate-600 mb-3 block"></i>
                <p class="text-slate-400">ဘယ်ဘက်တွင် ပလက်ဖောင်း ရွေးချယ်၍ CapCut Pro Anti-Copyright Settings များကို ထုတ်ယူပါ။</p>
            </div>

        </section>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        document.getElementById('workflowForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const platformVal = document.getElementById('platform').value;
            const style = document.getElementById('style').value;
            
            let platformName = platformVal === 'tiktok' ? 'TikTok / Shorts / Reels (9:16)' : 'YouTube Long Video (16:9)';

            let precisionHTML = '';
            if (platformVal === 'tiktok') {
                precisionHTML = `
                    <ul class="list-disc list-inside space-y-2 text-slate-300">
                        <li><strong>Aspect Ratio:</strong> 9:16 (Vertical)</li>
                        <li><strong>1. Mirror & Flip (အဓိကအချက်):</strong> ဗီဒီယိုဖိုင်ကို Edit > <span class="text-amber-400 font-bold">Mirror</span> ဖြင့် ဘယ်/ညာ ပြောင်းပြန်လှည့်ပါ။ (Algorithm ရှောင်ရန် အထိရောက်ဆုံး)</li>
                        <li><strong>2. Brightness & Exposure:</strong> Brightness <span class="text-amber-400 font-bold">+6</span> | Exposure <span class="text-amber-400 font-bold">+3</span></li>
                        <li><strong>3. Contrast & Highlights:</strong> Contrast <span class="text-amber-400 font-bold">+5</span> | Highlights <span class="text-amber-400 font-bold">-4</span></li>
                        <li><strong>4. Saturation & Vibrance:</strong> Saturation <span class="text-amber-400 font-bold">+7</span> | Vibrance <span class="text-amber-400 font-bold">+5</span></li>
                        <li><strong>5. Sharpen (ဓါတ်ပုံထက်ရှရှဖြစ်စေရန်):</strong> Sharpen <span class="text-amber-400 font-bold">+15</span></li>
                        <li><strong>6. Vignette & Grain:</strong> Vignette <span class="text-amber-400 font-bold">+10</span> | Film Grain <span class="text-amber-400 font-bold">+5</span> (Pixel matching လုံးဝဖျောက်ရန်)</li>
                        <li><strong>7. Speed & Scale:</strong> Speed <span class="text-amber-400 font-bold">1.08x</span> | Zoom <span class="text-amber-400 font-bold">6% to 8%</span></li>
                    </ul>
                `;
            } else {
                precisionHTML = `
                    <ul class="list-disc list-inside space-y-2 text-slate-300">
                        <li><strong>Aspect Ratio:</strong> 16:9 (Horizontal)</li>
                        <li><strong>1. Mirror & Flip:</strong> Edit > <span class="text-amber-400 font-bold">Mirror</span> (လိုအပ်ပါက အလှည့်အပြောင်းလုပ်ပါ)</li>
                        <li><strong>2. Brightness & Exposure:</strong> Brightness <span class="text-amber-400 font-bold">+4</span> | Exposure <span class="text-amber-400 font-bold">+2</span></li>
                        <li><strong>3. Contrast & Highlights:</strong> Contrast <span class="text-amber-400 font-bold">+4</span> | Highlights <span class="text-amber-400 font-bold">-3</span></li>
                        <li><strong>4. Saturation & Vibrance:</strong> Saturation <span class="text-amber-400 font-bold">+5</span> | Vibrance <span class="text-amber-400 font-bold">+4</span></li>
                        <li><strong>5. Sharpen:</strong> Sharpen <span class="text-amber-400 font-bold">+12</span></li>
                        <li><strong>6. Vignette & Grain:</strong> Vignette <span class="text-amber-400 font-bold">+8</span> | Film Grain <span class="text-amber-400 font-bold">+4</span></li>
                        <li><strong>7. Speed & Scale:</strong> Speed <span class="text-amber-400 font-bold">1.03x</span> | Zoom <span class="text-amber-400 font-bold">4% to 5%</span></li>
                    </ul>
                `;
            }

            const outputHTML = `
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-amber-400 mb-2">🎯 ပလက်ဖောင်း: ${platformName} (${style})</h3>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-emerald-400 mb-2">⚙️ Pro Mirror, Color & Visual Anti-Copyright Settings</h3>
                    ${precisionHTML}
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-blue-400 mb-2">🎵 Advanced Audio & Voice Anti-Match Settings</h3>
                    <ul class="list-disc list-inside space-y-1 text-slate-300">
                        <li>မူရင်း ဗီဒီယိုအသံ Volume = <span class="text-red-400 font-bold">0 (Mute / Detach and Delete)</span></li>
                        <li>Audio > <span class="text-amber-400 font-bold">Reduce Noise (ဆူညံသံဖယ်ရှားခြင်း)</span> ကို အမြဲ On ပါ။</li>
                        <li>ကိုယ်ပိုင် Voiceover အသံ Volume = <span class="text-emerald-400 font-bold">100%</span> (Voice Effects ထဲမှ Lo-Fi သို့မဟုတ် Megaphone ကဲ့သို့ အသံအနည်းငယ်ပြောင်းလဲခြင်းဖြင့် AI Voice Match ရှောင်နိုင်သည်)။</li>
                        <li>နောက်ခံသီချင်း (BGM) Volume = <span class="text-amber-400 font-bold">10% - 12%</span> (Auto Ducking ဖွင့်ရန်)</li>
                    </ul>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <h3 class="font-bold text-purple-400 mb-2">✂️ Advanced Splitting & Masking Tricks</h3>
                    <ul class="list-disc list-inside space-y-1 text-slate-300">
                        <li>ဗီဒီယိုဖိုင်ကို <span class="text-amber-400 font-bold">2 စက္ကန့်မှ 3.5 စက္ကန့်</span> တစ်ကြိမ်စီ Split လုပ်ပါ။</li>
                        <li>အပိုင်းအစတိုင်းတွင် 0.3s ဖြင့် Dissolve သို့မဟုတ် Camera Blur <span class="text-amber-400 font-bold">Transitions</span> ထည့်ပါ။</li>
                        <li>လိုအပ်ပါက အပေါ်မှ Overlay ပုံစံ Sticker သို့မဟုတ် Text Watermark ကို Blur ခံကာ ဖုံးအုပ်ပါ။</li>
                    </ul>
                </div>
            `;

            document.getElementById('workflowOutput').innerHTML = outputHTML;
            document.getElementById('placeholderState').classList.add('hidden');
            document.getElementById('outputContainer').classList.remove('hidden');
        });

        function copyToClipboard() {
            const container = document.getElementById('workflowOutput');
            navigator.clipboard.writeText(container.innerText).then(() => {
                alert('Copied to Clipboard!');
            });
        }

        function downloadTextFile() {
            const container = document.getElementById('workflowOutput');
            const fileName = 'CapCut_Pro_Anti_Copyright_Settings.txt';

            const blob = new Blob([container.innerText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
